<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猫猫小摊 · 领取猫饼</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#7a4b3a;background:#ffb8a8}
#scene{position:fixed;inset:0;width:100%;height:100%}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.2s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(14deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.paw{transition:transform .5s}
.give .paw{transform:translateY(-10px)}
.cloud{animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.bulb{animation:tw 1.6s ease-in-out infinite alternate}
.bulb:nth-child(2n){animation-delay:.8s}
@keyframes tw{from{opacity:.55}to{opacity:1}}
#cookie{opacity:0;transform-box:fill-box;transform-origin:center}
.give #cookie{animation:pop 1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(110px,30px) scale(.3)}100%{opacity:1;transform:translateY(0) scale(1) rotate(-6deg)}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,250,244,.88);backdrop-filter:blur(6px);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(122,75,58,.15);text-align:center}
#msg{font-size:14px;line-height:1.5;min-height:21px;margin-bottom:8px}
#msg b{color:#ff6f91;font-size:16px}
.btns{display:flex;gap:10px;justify-content:center}
button{flex:1;max-width:220px;font-size:18px;padding:11px 0;border:none;border-radius:40px;background:#ff8fab;color:#fff;font-weight:bold;box-shadow:0 4px 0 #e0607f;cursor:pointer;font-family:inherit}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #e0607f}
button:disabled{background:#c9b8bd;box-shadow:0 4px 0 #a99}
#again{background:#8fd3b6;box-shadow:0 4px 0 #5fae8e;display:none}
.conf{position:fixed;top:-20px;font-size:20px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}

#lid{opacity:0;transform:translateY(-18px);transition:all .35s}
.s-close #lid{opacity:1;transform:none}
.s-ding #lid{opacity:0;transform:translateY(-18px)}
#ladle{opacity:0;transform-box:fill-box;transform-origin:0% 100%;transition:opacity .2s}
.s-pour:not(.s-close) #ladle{opacity:1;animation:tilt 1.1s ease-in-out forwards}
@keyframes tilt{0%{transform:translate(-14px,-10px) rotate(0)}40%{transform:translate(0,0) rotate(0)}100%{transform:translate(0,0) rotate(38deg)}}
#stream{opacity:0}
.s-pour:not(.s-close) #stream{animation:strm 1.1s forwards}
@keyframes strm{0%,45%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}
#batter{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.s-pour #batter{animation:grow .6s .5s forwards}
@keyframes grow{to{transform:scale(1)}}
.give #batter{animation:none;transform:scale(0)}
.steam{opacity:0}
.s-pour .steam,.s-sizzle .steam{animation:puff 1s ease-out infinite}
.steam:nth-child(2){animation-delay:.33s!important}.steam:nth-child(3){animation-delay:.66s!important}
.s-ding .steam{animation:none;opacity:0}
@keyframes puff{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:.9}100%{opacity:0;transform:translateY(-26px) scale(1.4)}}
.s-sizzle:not(.s-ding) #pan{animation:shk .15s linear infinite}
@keyframes shk{50%{transform:translateX(1.5px)}}
#ding{opacity:0;transform-box:fill-box;transform-origin:center}
.s-ding #ding{animation:dg .8s ease-out forwards}
@keyframes dg{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
.give #ding{animation:none;opacity:0}
.making .blink ellipse{ry:4}
</style></head><body>

<ellipse cx="379" cy="322" rx="12" ry="14" fill="#ff8f8f"/><rect x="373" y="306" width="12" height="4" fill="#ffd36e"/></g>

 <path d="M20 50h260v30q-16 16-32 0q-16 16-33 0q-16 16-32 0q-16 16-33 0q-16 16-32 0q-16 16-33 0q-16 16-32 0q-16 16-33 0z" fill="#ff9eb8"/>
 <path d="M52 50h33v30q-16 16-33 0zM117 50h33v30q-16 16-33 0zM183 50h32v30q-16 16-32 0zM248 50h32v30q-16 16-32 0z" fill="#fff"/>
 <rect x="100" y="8" width="100" height="28" rx="14" fill="#ffd36e" stroke="#fff" stroke-width="3"/><text x="150" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4b3a">猫猫小摊</text>
 <path class="tail" d="M215 225q40-10 35-60q-2-12 8-10q12 40-35 82z" fill="#ffc98b"/>
 <ellipse cx="150" cy="210" rx="58" ry="45" fill="#ffc98b"/>
 <path d="M92 120l8-40 30 25zM208 120l-8-40-30 25z" fill="#ffc98b"/><path d="M102 112l4-22 15 14zM198 112l-4-22-15 14z" fill="#ffb3c6"/>
 <ellipse cx="150" cy="140" rx="62" ry="50" fill="#ffc98b"/>
 <path d="M135 95q15 10 30 0" stroke="#e8a060" stroke-width="5" fill="none" stroke-linecap="round"/>
 <g class="blink"><ellipse cx="127" cy="138" rx="7" ry="9" fill="#5a3527"/><ellipse cx="173" cy="138" rx="7" ry="9" fill="#5a3527"/><circle cx="129" cy="134" r="2.5" fill="#fff"/><circle cx="175" cy="134" r="2.5" fill="#fff"/></g>
 <ellipse cx="112" cy="155" rx="10" ry="6" fill="#ff9eb8" opacity=".7"/><ellipse cx="188" cy="155" rx="10" ry="6" fill="#ff9eb8" opacity=".7"/>

 <path d="M95 150h-22M95 158h-20M205 150h22M205 158h20" stroke="#c98b6b" stroke-width="2" stroke-linecap="round"/>

 <rect x="30" y="240" width="240" height="44" rx="8" fill="#f9cf8a" opacity=".5"/>
 <g class="paw"><ellipse cx="120" cy="222" rx="16" ry="11" fill="#ffc98b"/><ellipse cx="180" cy="222" rx="16" ry="11" fill="#ffc98b"/></g>

 <g transform="translate(236 214) scale(1.45) translate(-240 -215)"><g id="pan">
  <ellipse cx="240" cy="218" rx="32" ry="9" fill="#8a8a9a"/><ellipse cx="240" cy="215" rx="28" ry="7" fill="#5f5f70"/>

 <g font-size="22"><text x="44" y="272">🍪</text><text x="246" y="276">🍡</text></g>

</g>

<div class="bar"><div id="msg">猫猫老板今天限定送猫饼，快来领一个吧～</div>
<div class="btns"><button id="btn">领取猫饼 🍪</button><button id="again">再来一个 🔁</button></div></div>
<script>
const F=[["草莓味","#ffb3c6","酸酸甜甜，像恋爱的味道～"],["抹茶味","#b8e0a0","清新一口，烦恼通通不见！"],["奶油味","#fff0c8","软软绵绵，今天也要被温柔对待喵～"],["巧克力味","#c48a5e","浓浓甜甜，好运加倍！"],["芒果味","#ffd36e","阳光满满，元气一整天！"],["蓝莓味","#b9b6ff","眨眨眼，好梦就会来～"]];
const s=document.getElementById('scene'),b=document.getElementById('btn'),a=document.getElementById('again'),m=document.getElementById('msg'),ck=document.getElementById('ckbody');
let n=0;
const S=[['s-pour','🥄 猫猫正在倒面糊…'],['s-close','🐾 盖上猫猫模具，压一压…'],['s-sizzle','🔥 滋滋滋～猫猫正在做饼…'],['s-ding','✨ 叮！猫饼出炉啦～']];
const T=[0,1200,1900,3000];let busy=false;
function reset(){s.classList.remove('give','making',...S.map(x=>x[0]));void s.getBoundingClientRect();}
function make(f,freeze){reset();busy=true;b.disabled=true;a.disabled=true;s.classList.add('making');document.getElementById('batter').setAttribute('fill',f[1]);document.getElementById('stream').setAttribute('stroke',f[1]);
 S.forEach((x,i)=>{if(freeze!=null&&i>freeze)return;setTimeout(()=>{s.classList.add(x[0]);m.textContent=x[1];},freeze!=null?0:T[i]);});
 if(freeze==null)setTimeout(()=>give(f),3600);}
function give(f){n++;ck.setAttribute('fill',f[1]);s.classList.remove('making');s.classList.add('give');busy=false;
m.innerHTML=`🎉 领到 <b>${f[0]}猫饼</b>！${f[2]}`+(n>1?` <small>(第${n}个)</small>`:'');
b.disabled=true;b.textContent='已领取 ✓';a.disabled=false;a.style.display='block';confetti();}
function claim(){if(busy)return;make(F[Math.random()*F.length|0]);}
function confetti(){const e=['✨','🌸','⭐','💖','🐾','🎀'];for(let i=0;i<30;i++){const d=document.createElement('div');d.className='conf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.8+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4500);}}
b.onclick=claim;a.onclick=claim;
const h=location.hash;if(h=='#claimed'){give(F[Math.random()*F.length|0]);}else if(/^#make\d$/.test(h)){make(F[0],+h[5]-1);}
</script></body></html>
