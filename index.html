<style>

.give #cookie{animation:pop 1s cubic-bezier(.3,1.6,.5,1) forwards}

#msg{font-size:14px;line-height:1.5;min-height:21px;margin-bottom:8px}
#msg b{color:#ff6f91;font-size:16px}
.btns{display:flex;gap:10px;justify-content:center}

button:active{transform:translateY(3px);box-shadow:0 1px 0 #e0607f}
button:disabled{background:#c9b8bd;box-shadow:0 4px 0 #a99}
#again{background:#8fd3b6;box-shadow:0 4px 0 #5fae8e;display:none}
.conf{will-change:transform,opacity;position:fixed;top:-20px;font-size:20px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}

#lid{opacity:0;transform:translateY(-18px);transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.6,1)}
.s-close #lid{opacity:1;transform:none}
.s-ding #lid{opacity:0;transform:translateY(-18px)}
#ladle{opacity:0;transform-box:fill-box;transform-origin:0% 100%;transition:opacity .2s}
.s-pour:not(.s-close) #ladle{opacity:1;animation:tilt 1.1s ease-in-out forwards}
@keyframes tilt{0%{transform:translate(-14px,-10px) rotate(0)}40%{transform:translate(0,0) rotate(0)}100%{transform:translate(0,0) rotate(38deg)}}
#stream{opacity:0}
.s-pour:not(.s-close) #stream{animation:strm 1.1s forwards}
@keyframes strm{0%,45%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}
#batter{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.s-pour #batter{animation:grow .6s .5s forwards}
@keyframes grow{to{transform:scale(1)}}
.give #batter{animation:none;transform:scale(0)}
.steam{opacity:0}
.s-pour .steam,.s-sizzle .steam{animation:puff 1s ease-out infinite}
.steam:nth-child(2){animation-delay:.33s!important}.steam:nth-child(3){animation-delay:.66s!important}
.s-ding .steam{animation:none;opacity:0}
@keyframes puff{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:.9}100%{opacity:0;transform:translateY(-26px) scale(1.4)}}
.s-sizzle:not(.s-ding) #pan{animation:shk .15s linear infinite}
@keyframes shk{50%{transform:translateX(1.5px)}}
#ding{opacity:0;transform-box:fill-box;transform-origin:center}
.s-ding #ding{animation:dg .8s ease-out forwards}
@keyframes dg{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
.give #ding{animation:none;opacity:0}

/* whole-body acting: transforms driven by one rAF timeline in JS */

#cat{transform-origin:40% 100%}#head{transform-origin:50% 100%}#earL,#earR{transform-origin:50% 100%}#pawL,#pawR{transform-origin:center}
#happy{opacity:0;transition:opacity .2s}.blink{transition:opacity .2s}

<script>
const F=[["草莓味","#ffb3c6","酸酸甜甜，像恋爱的味道～"],["抹茶味","#b8e0a0","清新一口，烦恼通通不见！"],["奶油味","#fff0c8","软软绵绵，今天也要被温柔对待喵～"],["巧克力味","#c48a5e","浓浓甜甜，好运加倍！"],["芒果味","#ffd36e","阳光满满，元气一整天！"],["蓝莓味","#b9b6ff","眨眨眼，好梦就会来～"]];
const $=id=>document.getElementById(id);
const s=$('scene'),b=$('btn'),a=$('again'),m=$('msg'),ck=$('ckbody'),muteBtn=$('mute');
const G={cat:$('cat'),head:$('head'),pawL:$('pawL'),pawR:$('pawR'),earL:$('earL'),earR:$('earR'),tail:document.querySelector('.tail')};

/* ---------- Sound (Web Audio, all synthesized) ---------- */
let AC=null,master=null,noiseBuf=null,muted=localStorage.getItem('catMute')==='1',sizzleNode=null;
function updMute(){muteBtn.textContent=muted?'🔇':'🔊';if(master)master.gain.setTargetAtTime(muted?0:0.55,AC.currentTime,.03);}
updMute();
function audio(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=muted?0:0.55;
    const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==='suspended')AC.resume();return AC;}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function tone(type,f0,f1,dur,vol,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,.008,vol,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,type,freq,q=1,delay=0){if(!AC)return;const t=AC.currentTime+delay,src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;env(g,t,.01,vol,dur);src.connect(f);f.connect(g);g.connect(master);src.start(t,Math.random());src.stop(t+dur+.05);}
const SFX={
  blip(){tone('sine',700,1300,.09,.12);},
  pour(){noise(.9,.05,'bandpass',700,2,.35);for(let i=0;i<6;i++)tone('sine',420-i*25,180,.12,.09,.4+i*.13);},
  clunk(){tone('triangle',170,60,.18,.25);noise(.08,.12,'lowpass',900,1);},
  sizzleStart(){if(!AC||sizzleNode)return;const t=AC.currentTime,src=AC.createBufferSource(),hp=AC.createBiquadFilter(),bp=AC.createBiquadFilter(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
    src.buffer=noiseBuf;src.loop=true;hp.type='highpass';hp.frequency.value=2500;bp.type='peaking';bp.frequency.value=5000;bp.gain.value=6;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.2);lfo.frequency.value=13;lg.gain.value=.025;lfo.connect(lg);lg.connect(g.gain);
    src.connect(hp);hp.connect(bp);bp.connect(g);g.connect(master);src.start();lfo.start();sizzleNode={src,g,lfo};},
  sizzleStop(){if(!sizzleNode)return;const t=AC.currentTime,{src,g,lfo}=sizzleNode;g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0.0001,t,.08);src.stop(t+.5);lfo.stop(t+.5);sizzleNode=null;},
  ding(){[[1568,.16],[2349,.07],[3136,.04]].forEach(([f,v])=>{tone('sine',f,0,1.3,v);});tone('sine',2093,0,1,.08,.12);},
  meow(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(560,t);o.frequency.linearRampToValueAtTime(820,t+.16);o.frequency.linearRampToValueAtTime(600,t+.5);
    f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1900,t+.18);f.frequency.linearRampToValueAtTime(800,t+.5);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.05);g.gain.setValueAtTime(.2,t+.3);g.gain.exponentialRampToValueAtTime(0.0001,t+.55);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+.6);},
  sparkle(){tone('sine',600,1400,.1,.1);for(let i=0;i<6;i++)tone('sine',2000+Math.random()*2500,0,.25,.035,.08+i*.09);}
};
muteBtn.onclick=()=>{muted=!muted;localStorage.setItem('catMute',muted?'1':'0');audio();updMute();if(!muted)SFX.blip();};

/* ---------- Animation: one rAF timeline, continuous poses ---------- */
// pose: [catX,catY,catR,catSX,catSY, headY,headR,headS, pLx,pLy,pLs, pRx,pRy,pRr,pRs]
const P0=[0,0,0,1,1, 0,0,1, 0,0,1, 0,0,0,1];
const POUR=[4,5,5,1,1, 4,12,1, 0,0,1, 22,-14,-20,1];
const PRESS=[6,12,3,1.07,.88, 6,9,1, 10,2,1, 40,-4,0,1];
const REB=[5,8,3,.98,1.03, 5,8,1, 10,1,1, 38,-4,0,1];
const COOK=[3,5,2,1,1, 3,4,1, 2,0,1, 30,-2,0,1];
const ANT=[0,3,0,1.04,.94, 2,0,1, 0,2,1, 6,2,0,1];
const HOP=[0,-12,0,.97,1.05, -2,-6,1, 0,-10,1, 0,-10,0,1];
const LAND=[0,0,0,1.02,.98, 0,-6,1, 0,-6,1, 0,-6,0,1];
const GIVE=[0,4,0,1.07,1.07, -2,-3,1.04, 8,-14,1.15, -8,-14,0,1.15];
const REST=[0,2,0,1.03,1.03, -1,-2,1.02, 4,-6,1.06, -4,-6,0,1.06];
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; // easeInOutCubic
const back=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}; // easeOutBack
let KEYS=null; // [time, pose, easeFn]
function buildKeys(start){return [[0,start],[.55,POUR,ease],[1.2,POUR],[1.42,PRESS,ease],[1.65,REB,ease],[1.95,COOK,ease],[2.95,COOK],[3.08,ANT,ease],[3.28,HOP,back],[3.55,LAND,ease],[4.0,GIVE,back],[5.4,GIVE],[6.2,REST,ease]];}
function sample(t){if(!KEYS)return cur;let i=1;while(i<KEYS.length&&KEYS[i][0]<t)i++;if(i>=KEYS.length)return KEYS[KEYS.length-1][1];
  const [t0,p0]=KEYS[i-1],[t1,p1,fn]=KEYS[i];const k=t1>t0?(fn||(x=>x))(Math.min(1,Math.max(0,(t-t0)/(t1-t0)))):1;return p0.map((v,j)=>v+(p1[j]-v)*k);}
let cur=P0.slice(),startT=null,freezeT=null,phase=0,tailPh=0,lastNow=null,evIdx=0,EV=[],flavor=null;
function blend(t,a0,a1,b0,b1){return Math.min(1,Math.max(0,(t-a0)/(a1-a0)))*(1-Math.min(1,Math.max(0,(t-b0)/(b1-b0))));}
function frame(now){
  const dt=lastNow==null?0:Math.min(.05,(now-lastNow)/1000);lastNow=now;
  let t=startT==null?null:(freezeT!=null?freezeT:(now-startT)/1000);
  if(t!=null){while(evIdx<EV.length&&EV[evIdx][0]<=t){EV[evIdx][1]();evIdx++;}}
  const p=t==null?cur:sample(t);if(t!=null)cur=p;
  const w=t==null?0:blend(t,1.95,2.15,2.8,2.95); // sizzle wobble weight, fades in/out
  const tspd=1+w*2.4;tailPh+=dt*Math.PI*2*0.8*tspd;phase+=dt;
  const bob=Math.sin(phase*Math.PI*2*0.9)*w,nod=Math.sin(phase*Math.PI*2*1.8)*w,idle=Math.sin(phase*Math.PI*2*.35)*(1-w);
  G.cat.style.transform=`translate(${p[0]}px,${p[1]+bob*2+idle*.8}px) rotate(${p[2]+bob*1.5}deg) scale(${p[3]},${p[4]})`;
  G.head.style.transform=`translateY(${p[5]+nod}px) rotate(${p[6]+nod*4.5+idle*1.2}deg) scale(${p[7]})`;
  G.pawL.style.transform=`translate(${p[8]}px,${p[9]}px) scale(${p[10]})`;
  G.pawR.style.transform=`translate(${p[11]}px,${p[12]+nod*.8}px) rotate(${p[13]}deg) scale(${p[14]})`;
  const tw=x=>Math.max(0,Math.sin(x))**3;
  G.earL.style.transform=`rotate(${-14*tw(phase*12)*w}deg)`;G.earR.style.transform=`rotate(${14*tw(phase*12+1.6)*w}deg)`;
  G.tail.style.transform=`rotate(${7+7*Math.sin(tailPh)}deg)`;
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- Flow ---------- */
let n=0,busy=false;
const say=x=>()=>{m.textContent=x;};
const cls=(c,on=true)=>()=>s.classList.toggle(c,on);
function make(f,freeze){busy=true;b.disabled=true;a.disabled=true;flavor=f;
  s.classList.remove('give','happy','s-pour','s-close','s-sizzle','s-ding');void s.getBoundingClientRect();
  $('batter').setAttribute('fill',f[1]);$('stream').setAttribute('stroke',f[1]);ck.setAttribute('fill',f[1]);
  EV=[[0,()=>{cls('s-pour')();say('🥄 猫猫正在倒面糊…')();SFX.pour();}],
      [1.2,()=>{cls('s-close')();say('🐾 盖上猫猫模具，压一压…')();}],[1.4,()=>SFX.clunk()],
      [1.9,()=>{cls('s-sizzle')();say('🔥 滋滋滋～猫猫正在做饼…')();SFX.sizzleStart();}],
      [2.95,()=>SFX.sizzleStop()],
      [3.0,()=>{cls('s-ding')();cls('happy')();say('✨ 叮！猫饼出炉啦～')();SFX.ding();}],
      [3.6,()=>give(f)],[3.9,()=>SFX.meow()],[5.4,cls('happy',false)]];
  KEYS=buildKeys(cur.slice());evIdx=0;lastNow=null;
  if(freeze!=null){freezeT=freeze;startT=0;}else{freezeT=null;startT=performance.now();}}
function give(f){n++;s.classList.add('give');busy=false;
  m.innerHTML=`🎉 领到 <b>${f[0]}猫饼</b>！${f[2]}`+(n>1?` <small>(第${n}个)</small>`:'');
  b.disabled=true;b.textContent='已领取 ✓';a.disabled=false;a.style.display='block';confetti();}
function claim(){if(busy)return;audio();SFX.blip();make(F[Math.random()*F.length|0]);}
function confetti(){SFX.sparkle();const e=['✨','🌸','⭐','💖','🐾','🎀'];for(let i=0;i<18;i++){const d=document.createElement('div');d.className='conf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(2+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);d.addEventListener('animationend',()=>d.remove());}}
b.onclick=claim;a.onclick=claim;
const h=location.hash,FT={'#make1':.95,'#make2':1.45,'#make3':2.5,'#make4':3.3,'#make5':4.2};
if(h=='#auto')make(F[Math.random()*F.length|0]);else if(h=='#claimed')make(F[5],6.5);else if(FT[h])make(F[0],FT[h]);

</script></body></html>
